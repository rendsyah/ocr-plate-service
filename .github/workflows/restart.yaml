name: Restart - OCR Plate Service
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Version to rollback (e.g., v1.2.3)"
        required: true
        type: string
        default: ""

jobs:
  restart:
    name: Restart - OCR Plate Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Notify Restart Started
        continue-on-error: true
        uses: rendsyah/.github/.github/actions/notify@main
        with:
          channels: '["telegram"]'
          status: "STARTED"
          notify_url: ${{ vars.NOTIFY_URL }}
          remarks: "Restart started (Service)"

      - name: Execute Restart
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ inputs.target_version }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: REGISTRY_HOST, REGISTRY_USER, REGISTRY_PASSWORD, IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/projects/ocr-plate-service
            make restart

      - name: Notify Restart Result
        if: always()
        continue-on-error: true
        uses: rendsyah/.github/.github/actions/notify@main
        with:
          channels: '["telegram"]'
          status: ${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}
          notify_url: ${{ vars.NOTIFY_URL }}
          remarks: ${{ job.status == 'success' && 'Restart success (Service)' || 'Restart failed (Service)' }}
