name: Rollback - OCR Plate Service
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Version to rollback (e.g., v1.2.3)"
        required: true
        type: string
        default: ""

  workflow_call:
    inputs:
      target_version:
        description: "Version to rollback (e.g., v1.2.3)"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback - OCR Plate Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Notify Rollback Started
        uses: rendsyah/.github/.github/actions/notify@main
        with:
          channels: '["telegram"]'
          status: "STARTED"
          notify_url: ${{ vars.NOTIFY_URL }}
          remarks: "Rollback started (${{ inputs.target_version }})"

      - name: Execute Rollback
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ inputs.target_version }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: REGISTRY_HOST, REGISTRY_USER, REGISTRY_PASSWORD, IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/projects/ocr-plate-service
            make deploy

      - name: Execute Health Check
        uses: nick-invision/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 1
          retry_wait_seconds: 10
          command: curl -fsS --max-time 5 -o /dev/null "${{ vars.HEALTH_URL }}"

      - name: Notify Rollback Result
        if: always()
        uses: rendsyah/.github/.github/actions/notify@main
        with:
          channels: '["telegram"]'
          status: ${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}
          notify_url: ${{ vars.NOTIFY_URL }}
          remarks: ${{ job.status == 'success' && 'Rollback success (${{ inputs.target_version }})' || 'Rollback failed (${{ inputs.target_version }})' }}
