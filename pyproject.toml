[project]
name = "ocr-plate-service"
version = "0.1.0"
description = "Optical Character Recognition Plate Service"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "chardet>=3.0.2,<6",
    "fastapi[standard]>=0.136.3",
    "loguru>=0.7.3",
    "numpy<2.0",
    "opencv-python-headless<4.10",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "torch==2.12.1+cpu",
    "torchvision==0.27.1",
    "ultralytics>=8.4.65",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
