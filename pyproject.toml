[project]
name = "ocr-plate-service"
version = "0.1.0"
description = "Optical Character Recognition Plate Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "loguru>=0.7.3",
    "numpy<2.0",
    "opencv-python-headless<4.10",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "tenacity>=9.1.4",
    "ultralytics>=8.4.65",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
